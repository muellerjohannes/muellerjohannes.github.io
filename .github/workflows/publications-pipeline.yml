name: Publications Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pyyaml

      - name: Run publication tests
        run: python3 markdown_generator/test_publications.py

      - name: Update publication sources and merge
        run: python3 markdown_generator/update_publications.py

      - name: Regenerate publication markdown files
        run: python3 markdown_generator/pubsFromBib.py

      - name: Update about-page publication news
        run: python3 markdown_generator/update_about_news.py

      - name: Re-run tests against the regenerated data
        run: python3 markdown_generator/test_publications.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publication-pipeline
          path: |
            markdown_generator/publications.bib
            _data/publication_updates.yml
            _pages/about.md
            _publications

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/publications-pipeline
          title: "chore: update publications and publication news"
          commit-message: "chore: update publications and publication news"
          body: |
            Automated publications pipeline update.

            Includes:
            - refreshed `markdown_generator/publications.bib` (bot-owned file)
            - regenerated `_publications/*.md`
            - updated `_data/publication_updates.yml`
            - updated publication items under `## News` in `_pages/about.md`

            Not touched by the bot: `markdown_generator/publications_manual.bib`
            and `_data/publication_overrides.yml`.

            Review checklist:
            - Verify new publications and arXiv -> published transitions.
            - Check that nothing landed in the wrong section; correct it in
              `_data/publication_overrides.yml` rather than in the generated files.
            - Verify generated news bullets are correct.
            - Merge only if updates are accurate.
