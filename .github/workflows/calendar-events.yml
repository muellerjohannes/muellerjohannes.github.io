name: Calendar Events

# Imports events tagged [talk], [poster], [organizer], [chair] or [attend] from the
# private calendar feed (GitHub secret TALK_CALENDAR_URL) and re-renders the
# activities page. Quick (well under a minute).

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  import-calendar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml requests

      - name: Run tests
        run: |
          python3 markdown_generator/test_talks.py
          python3 markdown_generator/test_calendar.py

      - name: Import tagged events from the private calendar
        env:
          TALK_CALENDAR_URL: ${{ secrets.TALK_CALENDAR_URL }}
        run: python3 markdown_generator/fetch_calendar_events.py

      - name: Render the activities page
        run: python3 markdown_generator/render_talks.py

      - name: Re-run tests against the rendered page
        run: |
          python3 markdown_generator/test_talks.py
          python3 markdown_generator/test_calendar.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/calendar-events
          title: "chore: update events from the calendar"
          commit-message: "chore: update events from the calendar"
          body: |
            Automated calendar import.

            Includes:
            - refreshed `_data/calendar_events.yml` (only events tagged `[talk]`, `[poster]`,
              `[organizer]`, `[chair]`, `[attend]`; public fields only)
            - re-rendered talk, poster, conference and organization blocks of `_pages/activities.md`

            Review checklist:
            - Titles, dates, venues and links look right.
            - Nothing private slipped into a title or location.
            - Merge only if changes are correct.
